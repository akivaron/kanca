<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#f1f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Kanca — asisten AI untuk memantau dan mendelegasikan hal-hal yang penting.">
  <title>Kanca — Asistenmu untuk hal-hal yang penting</title>
  <script>
    (function () {
      var stored = localStorage.getItem('kanca-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.getElementById('theme-color').content = theme === 'dark' ? '#0c1410' : '#f1f4ef';
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
