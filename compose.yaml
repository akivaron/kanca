services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kanca
      POSTGRES_USER: kanca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanca-local-dev}
    volumes:
      - kanca-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanca -d kanca"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kanca:${POSTGRES_PASSWORD:-kanca-local-dev}@db:5432/kanca
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - kanca-data:/data
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kanca:${POSTGRES_PASSWORD:-kanca-local-dev}@db:5432/kanca
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    volumes:
      - kanca-data:/data
volumes:
  kanca-data:
  kanca-postgres:
